<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scout Match</title>
    <script>
    let currentEvent = "{{ event_id }}";

    function loadMatches() {
        fetch(`/get_matches/${currentEvent}`)
        .then(response => response.json())
        .then(data => {
            let matchSelect = document.getElementById('match_number');
            matchSelect.innerHTML = '';
            data.forEach(match => {
                let option = document.createElement('option');
                option.value = match;
                option.textContent = match;
                matchSelect.appendChild(option);
            });
            loadTeams(); // Auto-load teams for first match
        });
    }

    function loadTeams() {
        const matchNumber = document.getElementById('match_number').value;
        fetch(`/get_teams/${currentEvent}/${matchNumber}`)
        .then(response => response.json())
        .then(data => {
            let teamSelect = document.getElementById('team_number');
            teamSelect.innerHTML = '';
            data.forEach(team => {
                let option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamSelect.appendChild(option);
            });
        });
    }

    function switchEvent() {
        const newEvent = prompt("Enter new event ID (like 2024nyro):");
        if (newEvent) {
            currentEvent = newEvent;
            fetch(`/get_event_name/${currentEvent}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('event_name').textContent = data.event_name;
                loadMatches();
            });
        }
    }

    window.onload = function() {
        loadMatches();
    }
    </script>
</head>
<body>
    <h1>📍 Scouting Event: <span id="event_name">{{ event_name }}</span></h1>
    <button onclick="switchEvent()">Switch Event</button>

    <form method="POST" action="/submit">
        <input type="hidden" name="event_id" value="{{ event_id }}">

        <label>Match:</label>
        <select id="match_number" name="match_number" onchange="loadTeams()"></select><br>

        <label>Team:</label>
        <select id="team_number" name="team_number"></select><br>

        <h3>Auto</h3>
        <label>Auto Line:</label>
        <select name="auto_line">
            <option>Yes</option>
            <option>No</option>
        </select><br>

        <label>Dead Auto:</label>
        <select name="dead_auto">
            <option>Yes</option>
            <option>No</option>
        </select><br>

        <label>Start Position:</label>
        <select name="start_position">
            <option>Left</option>
            <option>Middle</option>
            <option>Right</option>
        </select><br>

        <h3>Tele-op</h3>
        <label>Coral Scoring:</label>
        <input type="number" name="coral_score" min="0" max="10"><br>

        <label>Coral Drops:</label>
        <input type="number" name="coral_drops" min="0" max="10"><br>

        <h3>Endgame</h3>
        <label>Endgame Result:</label>
        <select name="endgame_result">
            <option>Shallow</option>
            <option>Deep</option>
            <option>Park</option>
            <option>Attempt</option>
            <option>No Attempt</option>
        </select><br>

        <h3>Fouls</h3>
        <label>Minor Fouls:</label>
        <input type="number" name="minor_fouls" min="0" max="10"><br>

        <label>Major Fouls:</label>
        <input type="number" name="major_fouls" min="0" max="10"><br>

        <h3>Comments</h3>
        <label>Predefined Comment:</label>
        <select name="predefined_comment">
            {% for i in range(1, 46) %}
                <option value="{{ i }}">Comment {{ i }}</option>
            {% endfor %}
        </select><br>

        <label>Custom Comment:</label>
        <input type="text" name="custom_comment"><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
